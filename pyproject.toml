[project]
name = "protocol-x-tool-mcp"
version = "1.0.0"
description = "Security-first MCP server wrapping the most-used packages as schema-validated, sandboxed tools"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.12",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "requests>=2.32,<3",
    "Pillow>=11,<12",
    "pypdf>=5,<6",
    "pandas>=2.3,<3",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "httpx>=0.28",
    "uvicorn>=0.34",
    "starlette>=0.45",
    "fastembed>=0.5",
]

[project.scripts]
protocol-x-tool-mcp = "server.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.1",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "core", "agents", "adapters"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "templates"
"migrations" = "migrations"
"policies" = "policies"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: long-running tests (soak, benchmarks)",
    "live: requires live Token Factory credentials",
]

[tool.importlinter]
root_packages = ["server", "agents", "core", "adapters"]

[[tool.importlinter.contracts]]
name = "Layering: server -> agents -> core -> adapters"
type = "layers"
layers = [
    "server",
    "agents",
    "core",
    "adapters",
]
